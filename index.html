<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Controle do micro-ondas</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.0/mqttws31.js"></script>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        padding: 24px;
        place-items: center;
        color: #f5f6fa;
        background:
          radial-gradient(ellipse at 50% 0%, rgb(72 64 130 / 24%), transparent 55%),
          #11131a;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }

      .painel {
        width: min(100%, 390px);
        padding: 38px 30px 26px;
        text-align: center;
        background: #1b1e28;
        border: 1px solid #2b2f3c;
        border-radius: 26px;
        box-shadow: 0 24px 70px rgb(0 0 0 / 32%);
      }

      .icone {
        position: relative;
        width: 64px;
        height: 50px;
        margin: 0 auto 25px;
        border: 2px solid #a99bff;
        border-radius: 10px;
      }

      .icone::before {
        position: absolute;
        top: 7px;
        left: 7px;
        width: 34px;
        height: 32px;
        content: "";
        border: 1px solid #7164bf;
        border-radius: 5px;
      }

      .icone::after {
        position: absolute;
        top: 11px;
        right: 7px;
        width: 4px;
        height: 4px;
        content: "";
        background: #a99bff;
        border-radius: 50%;
        box-shadow: 0 10px #a99bff, 0 20px #a99bff;
      }

      .subtitulo {
        margin: 0 0 8px;
        color: #a99bff;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 2px;
      }

      h1 {
        margin: 0;
        font-size: 30px;
        letter-spacing: -1px;
      }

      .descricao {
        margin: 10px 0 28px;
        color: #9da1af;
        font-size: 14px;
      }

      .controles {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }

      button,
      select {
        font: inherit;
      }

      button {
        min-height: 58px;
        border: 0;
        border-radius: 14px;
        cursor: pointer;
      }

      button:focus-visible,
      select:focus-visible {
        outline: 3px solid #c7beff;
        outline-offset: 3px;
      }

      .botao-tempo {
        color: #e5e1ff;
        background: #302b4d;
      }

      .botao-tempo strong {
        margin-left: 9px;
        font-size: 18px;
      }

      .botao-ligar {
        color: #14151a;
        background: #a99bff;
        font-size: 16px;
        font-weight: 750;
      }

      .seletor {
        display: grid;
        gap: 10px;
        margin-top: 14px;
        padding: 16px;
        text-align: left;
        background: #242733;
        border: 1px solid #343847;
        border-radius: 14px;
      }

      .seletor[hidden] {
        display: none;
      }

      .seletor label {
        color: #c4c6d0;
        font-size: 13px;
      }

      .seletor select {
        width: 100%;
        padding: 11px 12px;
        color: #f5f6fa;
        background: #1b1e28;
        border: 1px solid #414657;
        border-radius: 9px;
      }

      .status {
        display: flex;
        min-height: 18px;
        align-items: center;
        justify-content: center;
        gap: 8px;
        margin: 22px 0 0;
        color: #969aa8;
        font-size: 12px;
      }

      .ponto {
        width: 7px;
        height: 7px;
        flex: 0 0 auto;
        background: #e2a95b;
        border-radius: 50%;
      }

      .ponto.conectado {
        background: #64d69a;
        box-shadow: 0 0 10px rgb(100 214 154 / 45%);
      }

      @media (max-width: 380px) {
        .painel {
          padding: 32px 20px 24px;
        }
      }
    </style>
  </head>
  <body>
    <main class="painel" aria-label="Controle do micro-ondas">
      <div class="icone" aria-hidden="true"></div>
      <p class="subtitulo">CONTROLE REMOTO</p>
      <h1>Micro-ondas</h1>
      <p class="descricao">Escolha o tempo e inicie pelo ESP32.</p>

      <div class="controles">
        <button
          class="botao-tempo"
          id="botao-tempo"
          type="button"
          aria-expanded="false"
          aria-controls="seletor"
        >
          Tempo <strong id="tempo-atual">10s</strong>
        </button>
        <button class="botao-ligar" id="botao-ligar" type="button">Ligar</button>
      </div>

      <div class="seletor" id="seletor" hidden>
        <label for="tempo">Defina de 1 a 20 segundos</label>
        <select id="tempo">
          <option value="1">1 segundo</option>
          <option value="2">2 segundos</option>
          <option value="3">3 segundos</option>
          <option value="4">4 segundos</option>
          <option value="5">5 segundos</option>
          <option value="6">6 segundos</option>
          <option value="7">7 segundos</option>
          <option value="8">8 segundos</option>
          <option value="9">9 segundos</option>
          <option value="10" selected>10 segundos</option>
          <option value="11">11 segundos</option>
          <option value="12">12 segundos</option>
          <option value="13">13 segundos</option>
          <option value="14">14 segundos</option>
          <option value="15">15 segundos</option>
          <option value="16">16 segundos</option>
          <option value="17">17 segundos</option>
          <option value="18">18 segundos</option>
          <option value="19">19 segundos</option>
          <option value="20">20 segundos</option>
        </select>
      </div>

      <p class="status" role="status" aria-live="polite">
        <span class="ponto" id="ponto-status"></span>
        <span id="texto-status">Configure o broker MQTT no código.</span>
      </p>
    </main>

    <script>
      // Configure estes valores conforme o broker e o firmware do ESP32.
      const MQTT = {
        host: "SEU_BROKER",
        port: 8884,
        path: "/mqtt",
        tempoTopic: "microondas/tempo",
        ligarTopic: "microondas/ligar",
        useSSL: true,
      };

      const botaoTempo = document.getElementById("botao-tempo");
      const botaoLigar = document.getElementById("botao-ligar");
      const seletor = document.getElementById("seletor");
      const campoTempo = document.getElementById("tempo");
      const tempoAtual = document.getElementById("tempo-atual");
      const textoStatus = document.getElementById("texto-status");
      const pontoStatus = document.getElementById("ponto-status");
      let clienteMqtt;

      function atualizarStatus(texto, conectado = false) {
        textoStatus.textContent = texto;
        pontoStatus.classList.toggle("conectado", conectado);
      }

      botaoTempo.addEventListener("click", () => {
        const aberto = seletor.hidden;
        seletor.hidden = !aberto;
        botaoTempo.setAttribute("aria-expanded", String(aberto));
      });

      campoTempo.addEventListener("change", () => {
        tempoAtual.textContent = `${campoTempo.value}s`;
        seletor.hidden = true;
        botaoTempo.setAttribute("aria-expanded", "false");
      });

      botaoLigar.addEventListener("click", () => {
        if (!clienteMqtt || !clienteMqtt.isConnected()) {
          atualizarStatus("Sem conexão MQTT. Verifique o broker.");
          return;
        }

        try {
          clienteMqtt.send(MQTT.tempoTopic, campoTempo.value, 1, false);
          clienteMqtt.send(MQTT.ligarTopic, "LIGAR", 1, false);
          atualizarStatus(`Contagem iniciada: ${campoTempo.value} segundos`, true);
        } catch (erro) {
          atualizarStatus(`Erro ao enviar comando: ${erro.message}`);
        }
      });

      if (MQTT.host === "SEU_BROKER") {
        atualizarStatus("Configure o broker MQTT no código.");
      } else if (!window.Paho || !window.Paho.MQTT) {
        atualizarStatus("Não foi possível carregar a biblioteca MQTT.");
      } else {
        clienteMqtt = new Paho.MQTT.Client(
          MQTT.host,
          MQTT.port,
          MQTT.path,
          `microondas-${Math.random().toString(16).slice(2)}`,
        );

        clienteMqtt.onConnectionLost = () => {
          atualizarStatus("Conexão MQTT perdida.");
        };

        atualizarStatus("Conectando ao broker...");
        clienteMqtt.connect({
          useSSL: MQTT.useSSL,
          timeout: 5,
          onSuccess: () => atualizarStatus("Conectado ao broker.", true),
          onFailure: (erro) =>
            atualizarStatus(`Falha na conexão: ${erro.errorMessage}`),
        });
      }
    </script>
  </body>
</html>
